name: Sonatype Release

on:
  push:
    branches: [master]
    tags: ["*"]

jobs:
  release-tag:
    runs-on: ubuntu-latest

    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Publish Tag as Release' || 'Publish Snapshot' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v9
      - name: Import GPG key for signing the release
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: coursier/setup-action@v3.1.0
        with:
          jvm: "temurin:1.17.0.15"
          apps: sbt
      # `ci-release` builds, documents and signs every module/platform/Scala-version cell in one sbt JVM before
      # uploading; with the local default (.jvmopts -Xmx3G) Scaladoc ran out of heap there (0.3.4). The runner has
      # 16 GB, so give the release build more; local builds keep .jvmopts as it is.
      - name: Give the release build more heap
        # assume-unchanged keeps the edit out of `git status` (the version is derived from git)
        run: sed -i 's/^-Xmx.*/-Xmx8G/' .jvmopts && git update-index --assume-unchanged .jvmopts && cat .jvmopts
      - name: Publish all projects
        run: sbt ci-release
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

# Scala compiler/stdlib versions are managed BY HAND. The plan is to move to Scala 3.9 once it fixes the bug that
# breaks our compilation, and then to stay on the 3.9 line indefinitely; Scala 2.13 patch versions are bumped by hand
# too.
#
# Ignoring the whole org.scala-lang group is the only reliable way to stop Scala Steward (same as in Hearth):
#   - updates.pin (e.g. version = "3.9.") does not hold: Steward "unifies" Scala 3 versions in the build up to the
#     newest one it knows about;
#   - per-artifact updates.ignore leaks: e.g. listing scala3-library_sjs1 misses the actually tracked
#     scala3-library_sjs1_3 artifact (platform + binary suffix), so update PRs slip through (kubuszok/hearth#297).
updates.ignore = [
  { groupId = "org.scala-lang" }
]
